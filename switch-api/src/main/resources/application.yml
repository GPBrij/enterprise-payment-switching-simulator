server:
  port: ${EPSS_SERVER_PORT:8081}

spring:
  application:
    name: switch-api

  datasource:
    url: ${EPSS_DB_URL:jdbc:postgresql://localhost:5432/epss}
    username: ${EPSS_DB_USERNAME:epss_user}
    password: ${EPSS_DB_PASSWORD:epss_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
